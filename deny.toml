# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run by the
# `deny` job in .github/workflows/security.yml, which replaces cargo-audit
# (same RustSec database). Verified with cargo-deny 0.20.2 on 2026-10-05.

[graph]
all-features = true

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = [
  # smartstring, unmaintained (repository archived 2026-05-03), no
  # vulnerability; pulled only by rhai 1.26.1. Lift when rhai drops it.
  { id = "RUSTSEC-2026-0249", reason = "transitive via rhai; informational (unmaintained), no known vulnerability" },
  # wasmtime 36.0.19, RUSTSEC-2026-0424 (2026-10-29): unchecked memory usage when borrowed
  # resources move between components. The component model is a cargo feature of wasmtime
  # that this workspace does not enable (default-features = false; cranelift, runtime, std),
  # so the code is not compiled; wasmtime itself is behind the asm-exec feature, off by
  # default. Patched in 36.0.20 (same LTS line): lift this entry with that bump.
  { id = "RUSTSEC-2026-0424", reason = "wasmtime component model not compiled (feature off); fixed by 36.0.20, pending" },
]

[licenses]
# Measured with `cargo deny list` on the current Cargo.lock (2026-10-05).
# OpenSSL and Unicode-DFS-2016 left out: no crate in the lock uses them
# (ring 0.17 is "Apache-2.0 AND ISC"; the icu crates are Unicode-3.0).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = [
  # Mozilla root store data, sole license of the crate.
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
# Path deps carry no `version`; allow-wildcard-paths exempts them because
# every workspace crate is `publish = false`.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# x0ne-confidential, pinned by rev in Cargo.toml.
allow-git = ["https://github.com/x0ne-labs/x0ne-Engine"]
