[workspace]
members = [
    "x0ne-actions",
    "x0ne-audit",
    "x0ne-cloud",
    "x0ne-asm",
    "x0ne-mcp",
    "x0ne-pointer",
    "x0ne-artifact",
    "x0ne-dataset",
    "x0ne-vm",
    "x0ne-browser",
    "x0ne-runtime", "x0ne-orchestrator", "x0ne-code",
    "x0ne-subagents",
]
# Pointer, vm and browser stay in the workspace, out of a plain `cargo build`.
default-members = [
    "x0ne-actions", "x0ne-audit", "x0ne-cloud", "x0ne-asm", "x0ne-mcp", "x0ne-artifact",
    "x0ne-dataset", "x0ne-runtime", "x0ne-orchestrator", "x0ne-code",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
# MSRV, enforced by the `msrv` CI job. Floor: x0ne-confidential (Engine) declares 1.98.
rust-version = "1.98"
license = "Apache-2.0"
authors = ["x0ne"]
repository = "https://github.com/x0ne-labs/x0ne-Harness"
homepage = "https://x0ne.co/harness"

# Lint policy shared by every crate (each member opts in with
# `[lints] workspace = true`). CI runs `cargo clippy --all-targets -- -D warnings`,
# so warnings are hard errors. The lints below are deliberately downgraded to
# `allow`: they are subjective design lints, cosmetic doc-formatting nits, or a
# benign test-only pattern — NOT correctness issues. Everything else stays
# denied. Revisit periodically and tighten where cheap.
[workspace.lints.clippy]
# Subjective design — refactoring is invasive and not always an improvement.
too_many_arguments = "allow"
type_complexity = "allow"
# Cosmetic rustdoc formatting.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
# Only occurrences are std::Mutex test-serialization locks held across .await in
# #[tokio::test]s (serialize tests touching global/env state) — benign, not prod.
await_holding_lock = "allow"
# ── Deferred style/idiom cleanups ────────────────────────────────────────────
# All verified non-correctness (no bugs). `cargo clippy --fix` already applied
# every machine-applicable suggestion; the rest need manual restructuring in
# core files, which isn't worth the regression risk right now. Tracked for
# incremental cleanup — chip these back to "warn" a file at a time.
needless_range_loop = "allow"
manual_clamp = "allow"
ptr_arg = "allow"
manual_strip = "allow"
sliced_string_as_bytes = "allow"
while_let_loop = "allow"
unnecessary_filter_map = "allow"
redundant_locals = "allow"
if_same_then_else = "allow"
format_in_format_args = "allow"
assertions_on_constants = "allow"
wildcard_in_or_patterns = "allow"
single_match = "allow"
result_large_err = "allow"
manual_try_fold = "allow"
len_without_is_empty = "allow"
filter_next = "allow"
field_reassign_with_default = "allow"
collapsible_match = "allow"

[workspace.dependencies]
# Async runtime
tokio             = { version = "1", features = ["full"] }
# Serialization
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
toml              = "1"
toml_edit         = "0.25"
# Error handling
thiserror         = "2"
anyhow            = "1"
# Logging
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# CLI
clap              = { version = "4", features = ["derive", "env"] }
# Date/time
chrono            = { version = "0.4", features = ["serde"] }
# Path utilities
dirs              = "7"
walkdir           = "2"
# Streaming
futures           = "0.3"
# Async trait
async-trait       = "0.1"
# Temporary files (sandbox scratch dirs, atomic writes, test fixtures)
tempfile          = "3"
# HTTP client, rustls only
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# HTTP server (`--serve`, artifact serving)
axum              = "0.8"
tower-http        = { version = "0.7", features = ["cors", "trace"] }
# Text and patterns
regex             = "1"
glob              = "0.3"
url               = "2"
# Hashing
sha2              = "0.11"
# ed25519 signature of the journal chain head (x0ne-audit). Same crate rustls links.
ring              = "0.17"
# Terminal
colored           = "3"
rustyline         = { version = "18", features = ["derive"] }
indicatif         = "0.18"
dotenvy           = "0.15"
# Encoding
base64            = "0.22"
uuid              = { version = "1", features = ["v7", "serde"] }
# Low-level libc (cfg(unix) only — Windows builds skip this dep)
libc              = "0.2"
landlock          = "0.4"
agent-client-protocol = "3.6"
# Pinned to one commit of the public Engine repository; cargo fetches it even
# with no feature that uses it. Local Engine work: a [patch] in an unpublished
# .cargo/config.toml (CONTRIBUTING.md).
x0ne-confidential = { git = "https://github.com/x0ne-labs/x0ne-Engine", rev = "b626fae7d6402290fb5ad70271c92d1bcd88646f" }

# 2026-10-27: each session start hashes the whole executable (x0ne-audit binary_sha256).
# Unoptimized: 8 s on the 410 MB debug binary before the first model request; 0.26 s at opt-level 3.
# Debug and test builds only; release builds are unchanged.
[profile.dev.package.sha2]
opt-level = 3
