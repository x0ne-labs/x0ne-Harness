# Forward proxy for the sandbox: allowlisted hosts only, CONNECT on 443 only.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Notice
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 127.0.0.0/8
ConnectPort 443
Filter "/etc/tinyproxy/allow.filter"
FilterType ere
FilterDefaultDeny Yes
FilterCaseSensitive Off
FilterURLs Off
DisableViaHeader Yes
