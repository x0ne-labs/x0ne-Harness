[package]
name = "x0ne-vm"
version.workspace = true
publish = false   # not published on crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "X0NE-VM: libvirt + VNC backed agent for QEMU/KVM. Exposes a vm_* MCP toolbelt so Claude Code (or any MCP client) can pilot virtual machines with screenshot/click/type/snapshot."
authors = ["x0ne"]
keywords = ["ai", "agent", "libvirt", "vnc", "mcp"]
categories = ["virtualization", "command-line-utilities"]

[lib]
name = "x0ne_vm"
path = "src/lib.rs"

[[bin]]
name = "x0ne-vm-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "x0ne-vmd"
path = "src/bin/vmd.rs"

[dependencies]
x0ne-mcp        = { path = "../x0ne-mcp" }
tokio           = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
anyhow          = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait     = { workspace = true }
base64          = { workspace = true }
dirs            = { workspace = true }
libc            = { workspace = true }
image           = { version = "0.25", default-features = false, features = ["png", "pnm"] }

[lints]
workspace = true
