# cargo-about configuration: `make third-party` renders THIRD-PARTY.md from
# Cargo.lock through about.hbs. Same license allow-list as deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# Dev and build dependencies are not linked into the shipped binaries.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Every workspace crate is `publish = false`: first party, not third.
[private]
ignore = true
