name: Release

# On a signed tag vX.Y.Z: static Linux binaries (musl) built twice on two
# runners and refused if the builds differ, macOS binaries, SHA256SUMS,
# CycloneDX SBOMs and SLSA provenance, attached to a DRAFT release that a
# maintainer reviews and publishes by hand. Nothing goes to crates.io.
#
# Assets (names are stable; install.sh depends on them):
#   x0ne-x86_64-unknown-linux-musl.tar.gz    x0ne-aarch64-unknown-linux-musl.tar.gz
#   x0ne-x86_64-apple-darwin.tar.gz          x0ne-aarch64-apple-darwin.tar.gz
#   x0ne-code.cdx.json  x0ne-runtime.cdx.json  x0ne-orchestrator.cdx.json
#   SHA256SUMS
# Each archive holds one directory, x0ne-<target>/, with the binaries x0ne,
# x0ne-runtime and x0ne-orchestrator, LICENSE, README.md and config/ (the
# runtime profiles x0ne-runtime.toml, x0ne-runtime-sandbox.toml and the
# read-only MCP profile x0ne-runtime-mcp.toml that docs/mcp.md names).
on:
  push:
    tags: ["v*"]

permissions: {}

# Never cancel a release half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.98.1
  # Same compiler as rust-toolchain.toml, on musl: binaries are static. Pinned
  # by index digest, so a rebuild anywhere uses the same toolchain, libc and paths.
  BUILD_IMAGE: docker.io/library/rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f
  BINS: x0ne x0ne-runtime x0ne-orchestrator

jobs:
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub marks a tag "verified" only if it is annotated and signed by a
      # key registered on the tagger's account. A lightweight or unsigned tag stops here.
      - name: Tag is annotated and its signature verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          obj=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          read -r type sha <<< "$obj"
          if [ "$type" != tag ]; then echo "::error::${TAG} is a lightweight tag"; exit 1; fi
          verdict=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified|tostring + " " + .verification.reason')
          echo "signature: ${verdict}"
          if [ "${verdict%% *}" != true ]; then echo "::error::${TAG} is not signed by a verified key"; exit 1; fi
      - name: Tag equals the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ "v${version}" != "${TAG}" ]; then echo "::error::tag ${TAG} but Cargo.toml says ${version}"; exit 1; fi

  linux:
    name: linux (${{ matrix.target }}, ${{ matrix.attempt }})
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
        # Two independent builds per target; `reproducible` compares them.
        attempt: [first, second]
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Native build on each architecture (no cross toolchain). cargo-auditable
      # embeds the dependency list in each binary (`cargo audit bin` reads it).
      # Two inputs made two builds differ (measured 2026-10-05): the build date
      # stamped by x0ne-orchestrator/build.rs (SOURCE_DATE_EPOCH = commit time)
      # and the compile-time seed of ahash, enabled by rhai (CONST_RANDOM_SEED).
      - name: Build in the pinned image
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          export CONST_RANDOM_SEED="$GITHUB_SHA"
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build -e SOURCE_DATE_EPOCH -e CONST_RANDOM_SEED \
            -e CARGO_TARGET_DIR=/build/target -e CARGO_INCREMENTAL=0 -e BINS "$BUILD_IMAGE" \
            sh -euc '
              cargo install --locked cargo-auditable@0.7.7 cargo-cyclonedx@0.5.9
              set --; for b in $BINS; do set -- "$@" --bin "$b"; done
              cargo auditable build --release --locked "$@"
              for c in x0ne-code x0ne-runtime x0ne-orchestrator; do
                cargo cyclonedx --format json --spec-version 1.5 --all -q --manifest-path "$c/Cargo.toml"
              done'
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct)
          name="x0ne-${TARGET}"
          mkdir -p "dist/${name}/config"
          for b in $BINS; do
            file "target/release/$b" | tee /dev/stderr | grep -q 'static' # musl: no dynamic loader
            cp "target/release/$b" "dist/${name}/"
          done
          cp LICENSE README.md "dist/${name}/"
          cp x0ne-runtime/x0ne-runtime.toml x0ne-runtime/x0ne-runtime-sandbox.toml "dist/${name}/config/"
          cp x0ne-runtime-mcp-readonly.toml "dist/${name}/config/x0ne-runtime-mcp.toml"
          # Deterministic archive: sorted, fixed owner and mtime, no gzip timestamp.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
            -C dist -cf - "${name}" | gzip -n > "dist/${name}.tar.gz"
          read -ra bins <<< "$BINS"
          (cd "dist/${name}" && sha256sum "${bins[@]}") > "dist/${name}.binaries.sha256"
          rm -rf "dist/${name:?}"
          for c in x0ne-code x0ne-runtime x0ne-orchestrator; do cp "$c/$c.cdx.json" dist/; done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.target }}-${{ matrix.attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Not compared bit for bit: Apple's toolchain is not pinned like the image above.
  macos:
    name: macos (${{ matrix.target }})
    needs: verify-tag
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET" --no-self-update
        env:
          TARGET: ${{ matrix.target }}
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(); for b in $BINS; do args+=(--bin "$b"); done
          cargo build --release --locked --target "$TARGET" "${args[@]}"
          name="x0ne-${TARGET}"
          mkdir -p "dist/${name}/config"
          for b in $BINS; do cp "target/${TARGET}/release/$b" "dist/${name}/"; done
          cp LICENSE README.md "dist/${name}/"
          cp x0ne-runtime/x0ne-runtime.toml x0ne-runtime/x0ne-runtime-sandbox.toml "dist/${name}/config/"
          cp x0ne-runtime-mcp-readonly.toml "dist/${name}/config/x0ne-runtime-mcp.toml"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name:?}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: reproducible
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
      # Binaries and archives must be bit-for-bit identical. The SBOMs are
      # not compared: they carry a serial number and a timestamp.
      - run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            a="linux-${t}-first"; b="linux-${t}-second"
            diff "$a/x0ne-${t}.binaries.sha256" "$b/x0ne-${t}.binaries.sha256"
            cmp "$a/x0ne-${t}.tar.gz" "$b/x0ne-${t}.tar.gz"
            echo "${t}: identical"; cat "$a/x0ne-${t}.binaries.sha256"
          done

  release:
    name: release
    needs: [reproducible, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance (Sigstore, GitHub OIDC)
      attestations: write # store the provenance
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: in
      - name: Assemble assets and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir dist
          cp in/linux-*-first/*.tar.gz in/macos-*/*.tar.gz dist/
          cp in/linux-x86_64-unknown-linux-musl-first/*.cdx.json dist/
          (cd dist && sha256sum -- *.tar.gz *.cdx.json > SHA256SUMS && sha256sum -c SHA256SUMS)
          ls -l dist
      # Verify with: gh attestation verify <file> --repo <owner>/x0ne-Harness
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Release notes = the CHANGELOG section of this version, if present.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag $pre \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md dist/*
