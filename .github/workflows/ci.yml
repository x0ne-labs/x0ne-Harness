name: CI

# Quality gates. Every job name below is a required status check of the
# `main` ruleset: renaming a job means updating the ruleset in the same PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No token permission unless a job asks for it.
permissions: {}

# A new push to a PR cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Same compiler as rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.98.1

jobs:
  # A fresh clone of this repository alone must resolve and build: no path
  # dependency may point outside it.
  standalone:
    name: standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - name: No path dependency outside the repository
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          jq -r --arg root "$GITHUB_WORKSPACE/" \
            '.packages[] | select(.source == null) | .manifest_path | select(startswith($root) | not)' \
            "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/outside.txt"
          if [ -s "$RUNNER_TEMP/outside.txt" ]; then
            echo "::error::path dependencies outside the repository:"; cat "$RUNNER_TEMP/outside.txt"; exit 1
          fi
      - run: cargo build --locked --workspace

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # All of clippy::pedantic, minus the lints that had hits on 2026-10-05
      # (the debt: drop an -A once its lint is fixed). A lint new in a later
      # clippy is enforced by default.
      PEDANTIC: >-
        -W clippy::pedantic
        -A clippy::uninlined_format_args
        -A clippy::must_use_candidate
        -A clippy::doc_markdown
        -A clippy::redundant_closure_for_method_calls
        -A clippy::cast_possible_truncation
        -A clippy::missing_errors_doc
        -A clippy::map_unwrap_or
        -A clippy::format_push_string
        -A clippy::too_many_lines
        -A clippy::cast_precision_loss
        -A clippy::unused_async
        -A clippy::manual_let_else
        -A clippy::missing_panics_doc
        -A clippy::items_after_statements
        -A clippy::match_same_arms
        -A clippy::cast_lossless
        -A clippy::cast_sign_loss
        -A clippy::single_match_else
        -A clippy::needless_pass_by_value
        -A clippy::default_trait_access
        -A clippy::unnested_or_patterns
        -A clippy::assigning_clones
        -A clippy::ignored_unit_patterns
        -A clippy::similar_names
        -A clippy::semicolon_if_nothing_returned
        -A clippy::cast_possible_wrap
        -A clippy::explicit_iter_loop
        -A clippy::if_not_else
        -A clippy::float_cmp
        -A clippy::return_self_not_must_use
        -A clippy::needless_continue
        -A clippy::unused_async_trait_impl
        -A clippy::unused_self
        -A clippy::unnecessary_debug_formatting
        -A clippy::implicit_clone
        -A clippy::trivially_copy_pass_by_ref
        -A clippy::format_collect
        -A clippy::unchecked_time_subtraction
        -A clippy::single_char_pattern
        -A clippy::needless_raw_string_hashes
        -A clippy::ref_option
        -A clippy::used_underscore_binding
        -A clippy::borrow_as_ptr
        -A clippy::bool_to_int_with_if
        -A clippy::unreadable_literal
        -A clippy::implicit_hasher
        -A clippy::struct_excessive_bools
        -A clippy::manual_string_new
        -A clippy::many_single_char_names
        -A clippy::case_sensitive_file_extension_comparisons
        -A clippy::unnecessary_wraps
        -A clippy::no_effect_underscore_binding
        -A clippy::redundant_else
        -A clippy::enum_glob_use
        -A clippy::range_plus_one
        -A clippy::manual_midpoint
        -A clippy::wildcard_imports
        -A clippy::elidable_lifetime_names
        -A clippy::stable_sort_primitive
        -A clippy::unnecessary_trailing_comma
        -A clippy::doc_link_with_quotes
        -A clippy::struct_field_names
        -A clippy::self_only_used_in_recursion
        -A clippy::inconsistent_struct_constructor
        -A clippy::nonminimal_bool
        -A clippy::cloned_instead_of_copied
        -A clippy::option_option
        -A clippy::ptr_as_ptr
        -A clippy::manual_is_variant_and
        -A clippy::large_stack_arrays
        -A clippy::match_wild_err_arm
        -A clippy::ignore_without_reason
        -A clippy::ref_as_ptr
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy (default features)
        run: |
          read -ra pedantic <<< "$PEDANTIC"
          cargo clippy --locked --workspace --all-targets -- -D warnings "${pedantic[@]}"
      - name: clippy (all features)
        run: |
          read -ra pedantic <<< "$PEDANTIC"
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings "${pedantic[@]}"

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bwrap is the runtime's command isolation; some tests spawn `ssh`.
      # Neither ships on the hosted image.
      - name: Install bubblewrap and ssh client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap openssh-client
      # AppArmor on ubuntu-24.04 restricts unprivileged user namespaces: bwrap failed with
      # "Failed RTM_NEWADDR: Operation not permitted" on 2026-11-05. The runner is disposable.
      # https://github.com/actions/runner-images/issues/10443
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every test binary runs before the job reports red: one failure no longer hides the rest.
      # The confinement tests skip where bwrap cannot start; on this runner that is a failure.
      - name: test (all features, doctests included)
        env:
          X0NE_REQUIRE_BWRAP: "1"
        run: cargo test --locked --workspace --all-features --no-fail-fast
      - name: scenario suite
        run: cargo run --locked --bin x0ne-scenario-runner
      - name: undo demo checks every file it claims back
        run: |
          cargo build --locked --bin x0ne-runtime
          X0NE_RUNTIME=target/debug/x0ne-runtime bash scripts/test-demo-undo.sh

  doc:
    name: doc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --workspace --no-deps
      - run: cargo doc --locked --workspace --no-deps --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `rust-version = "1.98"` means 1.98.0; rustup would resolve "1.98" to
      # the newest 1.98.x, so the patch level is made explicit.
      - name: Install the declared MSRV
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ -z "$msrv" ]; then echo "::error::no rust-version in the workspace Cargo.toml"; exit 1; fi
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --workspace --all-targets --all-features

  stable:
    name: stable
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Overrides rust-toolchain.toml: catches a break from the next compiler early.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --workspace --all-targets --all-features

  # The release binaries are static musl builds; a glibc-only signature breaks
  # them (2026-10-05: libc::ioctl takes a c_int request on musl).
  musl:
    name: musl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The image of release.yml.
      BUILD_IMAGE: docker.io/library/rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build -e CARGO_TARGET_DIR=/build/target "$BUILD_IMAGE" \
            cargo build --locked --bin x0ne --bin x0ne-runtime --bin x0ne-orchestrator

  # The installer serves macOS; this proves the workspace still builds there.
  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --workspace

  # The installer, as users run it: POSIX syntax, shellcheck, https only.
  installer:
    name: installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n install.sh
      - run: shellcheck --shell=sh install.sh scripts/test-install-https-only.sh scripts/test-install-provenance.sh
      - run: sh scripts/test-install-https-only.sh
      - run: sh scripts/test-install-provenance.sh
